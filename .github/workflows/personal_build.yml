name: Personal source build

on:
  push:
    branches:
      - DIY
    paths:
      - 'src/zh/jinmantiantang/**'
      - 'core/**'
      - 'compiler/**'
      - 'common/**'
      - 'lib/**'
      - 'lib-multisrc/**'
      - 'gradle/**'
      - 'gradlew'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.editorconfig'
      - '.github/personal-sources.txt'
      - '.github/scripts/prepare-personal-build.py'
      - '.github/scripts/tests/test_personal_build.py'
      - '.github/workflows/personal_build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: personal-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.ref == 'refs/heads/DIY'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout personal sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check signing configuration
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          ALIAS: ${{ secrets.ALIAS }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          missing=0
          for name in SIGNING_KEY ALIAS KEY_STORE_PASSWORD KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing Actions secret: $name. See PERSONAL_BUILD.md."
              missing=1
            fi
          done
          exit "$missing"

      - name: Test personal build configuration
        run: python3 -B -m unittest discover -s .github/scripts/tests -v

      - name: Load maintained sources only
        id: sources
        run: python3 -B .github/scripts/prepare-personal-build.py

      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: 25
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: false

      - name: Install the required Android SDK platform
        env:
          COMPILE_SDK: ${{ steps.sources.outputs.compile_sdk }}
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-${COMPILE_SDK}"'

      - name: Lint and run source unit tests
        env:
          BUILD_MODULES: ${{ steps.sources.outputs.modules }}
        run: |
          read -r -a modules <<< "$BUILD_MODULES"
          tasks=()
          for module in "${modules[@]}"; do
            tasks+=("${module}:lintRelease" "${module}:testDebugUnitTest")
          done
          ./gradlew --no-daemon --no-configuration-cache --stacktrace "${tasks[@]}"

      - name: Restore and validate the fixed signing key
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          ALIAS: ${{ secrets.ALIAS }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
        run: |
          umask 077
          printf '%s' "$SIGNING_KEY" | base64 --decode > signingkey.jks
          test -s signingkey.jks
          keytool -list -keystore signingkey.jks -alias "$ALIAS" \
            -storepass:env KEY_STORE_PASSWORD > /dev/null

      - name: Build signed release extensions
        env:
          BUILD_MODULES: ${{ steps.sources.outputs.modules }}
          ALIAS: ${{ secrets.ALIAS }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          read -r -a modules <<< "$BUILD_MODULES"
          tasks=()
          for module in "${modules[@]}"; do
            tasks+=("${module}:assembleRelease")
          done
          ./gradlew --no-daemon --no-configuration-cache --stacktrace "${tasks[@]}"

      - name: Verify release APK signatures
        env:
          BUILD_MODULES: ${{ steps.sources.outputs.modules }}
        run: |
          apksigner=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          test -n "$apksigner"
          read -r -a modules <<< "$BUILD_MODULES"
          shopt -s nullglob
          for module in "${modules[@]}"; do
            directory="${module//:/\/}"
            directory="${directory#/}"
            apks=("$directory"/build/outputs/apk/release/*.apk)
            if (( ${#apks[@]} == 0 )); then
              echo "::error::No release APK produced for $module"
              exit 1
            fi
            for apk in "${apks[@]}"; do
              "$apksigner" verify --verbose --print-certs "$apk"
            done
          done

      - name: Upload signed extensions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: personal-extensions-${{ github.run_number }}
          path: |
            src/**/build/outputs/apk/release/*.apk
            src/**/build/outputs/jar/release/*.jar
            src/**/build/keiyoushi-source-info.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload lint and test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: personal-build-reports-${{ github.run_number }}
          path: |
            src/**/build/reports/lint-results-release.*
            src/**/build/reports/tests/testDebugUnitTest/**
            src/**/build/test-results/testDebugUnitTest/**
          if-no-files-found: ignore
          retention-days: 7

      - name: Remove the signing key
        if: always()
        run: rm -f -- signingkey.jks
